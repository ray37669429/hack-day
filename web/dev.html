<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 工作台</title>
<!-- 開發用工作台（深色、資訊密集的分析軟體風格），一個電腦畫面放得下、不用捲動：
     左＝真的農民手機頁（依螢幕高度等比縮放）；中＝KPI、流程圖、物件卡片；右＝agent 事件串流（同類合併，新的在底部）。
     資料來自 /api/cases/{id}（只開在本機）與 /api/f/{token}，每 1.5 秒更新。這一頁不給農民用。 -->
<style>
:root {
  color-scheme: dark;
  --bg: #111418; --panel: #1C2127; --panel2: #252A31; --line: #383E47; --line2: #2F343C;
  --fg: #F6F7F9; --fg2: #ABB3BF; --fg3: #738091;
  --blue: #4C90F0; --blue-d: #2D72D2; --green: #32A467; --orange: #EC9A3C; --red: #E76A6E;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
  font: 13px/1.45 "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
button { font: inherit; }
body { display: grid; grid-template-rows: 40px minmax(0, 1fr); }
header { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; white-space: nowrap; }
header .logo { width: 16px; height: 16px; border: 2px solid var(--blue); border-radius: 3px; transform: rotate(45deg); margin: 0 6px 0 2px; flex: none; }
header h1 { font-size: 14px; font-weight: 600; margin: 0; }
header .sep { width: 1px; height: 18px; background: var(--line); margin: 0 2px; flex: none; }
.tbtn { border: 1px solid var(--line); background: var(--panel2); color: var(--fg); border-radius: 3px; padding: 2px 9px; cursor: pointer; text-decoration: none; font-size: 12px; }
.tbtn:hover { border-color: var(--blue); }
.crumb { font-family: var(--mono); color: var(--fg2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--fg2); font-size: 12px; margin-left: auto; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: ping 1.6s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(50,164,103,.6); } 70%, 100% { box-shadow: 0 0 0 6px rgba(50,164,103,0); } }

main { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(300px, 25vw); gap: 8px; padding: 8px; min-height: 0; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.pane > h2 { margin: 0; padding: 5px 10px; font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--fg2);
  border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; flex: none; white-space: nowrap; }
.pane > h2 .cnt { margin-left: auto; font-family: var(--mono); color: var(--fg3); letter-spacing: 0; font-weight: 400; overflow: hidden; text-overflow: ellipsis; }

/* 手機：原尺寸 375×812，依可用高度等比縮小 */
.phonecol { display: flex; flex-direction: column; min-height: 0; }
.phonebox { flex: 1; min-height: 0; position: relative; }
.phone { position: absolute; top: 0; left: 0; width: 391px; height: 828px; border: 8px solid #000; border-radius: 34px; overflow: hidden; background: #fff; transform-origin: 0 0; }
.phone iframe { width: 375px; height: 812px; border: 0; display: block; }

.mid { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 8px; min-height: 0; min-width: 0; }
.kpis { display: grid; grid-template-columns: 1.4fr repeat(4, 1fr); gap: 8px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; min-width: 0; }
.kpi small { display: block; font-size: 11px; color: var(--fg3); white-space: nowrap; }
.kpi b { font-size: 17px; font-weight: 600; font-family: var(--mono); white-space: nowrap; }
.kpi b.txt { font-family: inherit; font-size: 15px; }
.kpi span { font-size: 11px; color: var(--fg2); margin-left: 3px; }
.kpi .meter { height: 3px; background: var(--line2); border-radius: 2px; margin-top: 3px; overflow: hidden; }
.kpi .meter i { display: block; height: 100%; background: var(--green); transition: width .4s; }

.graph svg { display: block; width: 100%; height: auto; max-height: 31vh; }
.node rect { fill: var(--panel2); stroke: var(--line); stroke-width: 1.5; rx: 4; transition: stroke .3s, fill .3s; }
.node .t { fill: var(--fg); font-size: 13px; font-weight: 600; }
.node .m { fill: var(--fg2); font-size: 11.5px; font-family: var(--mono); }
.node .dot { fill: var(--fg3); }
.node.run rect { stroke: var(--blue); fill: #1B2A3F; }
.node.run .dot { fill: var(--blue); }
.node.done rect { stroke: var(--green); }
.node.done .dot { fill: var(--green); }
.node.warn rect { stroke: var(--orange); }
.node.warn .dot { fill: var(--orange); }
.node.human rect { stroke-dasharray: 5 3; }
.node.flash rect { filter: drop-shadow(0 0 7px var(--blue)); stroke: var(--blue); }
.edge { fill: none; stroke: var(--line); stroke-width: 1.5; }
.edge.on { stroke: var(--blue); stroke-dasharray: 6 5; animation: flow .8s linear infinite; }
.edge.done { stroke: #2B6E4B; }
@keyframes flow { to { stroke-dashoffset: -11; } }
.legend { display: flex; gap: 12px; padding: 2px 10px 5px; color: var(--fg3); font-size: 11px; white-space: nowrap; overflow: hidden; }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }

/* 物件卡片：每筆土地一張，欄位是小標籤（滑鼠停留看值） */
.objs { flex: 1; min-height: 0; padding: 6px; display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 6px; align-content: start; overflow: hidden; }
.obj { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; min-width: 0; }
.obj .oh { display: flex; gap: 6px; align-items: baseline; white-space: nowrap; }
.obj .oh b { font-weight: 600; }
.obj .id { font-family: var(--mono); color: var(--fg3); font-size: 11px; }
.obj .v { color: var(--fg2); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.obj .sub { margin-top: 3px; padding-top: 3px; border-top: 1px dashed var(--line); }
.fields { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.f { font-size: 11px; line-height: 18px; padding: 0 6px; border-radius: 3px; background: #3A3F47; color: var(--fg2); white-space: nowrap; cursor: default; }
.f.confirmed { background: rgba(50,164,103,.22); color: #72CA9B; }
.f.rejected { background: rgba(231,106,110,.22); color: #FA999C; }
.f.unclear { background: rgba(236,154,60,.22); color: #FBB360; }
.f.flagged { box-shadow: inset 0 0 0 1px var(--orange); }
.warnline { color: var(--orange); font-size: 11px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 事件串流：新的在底部，舊的從頂部淡出，不用捲動 */
.tbtn.demo { background: var(--blue-d); border-color: var(--blue-d); font-weight: 600; }
.tbtn.demo:hover { background: var(--blue); }
.demo { flex: none; margin: 8px 8px 0; border: 1px solid var(--blue-d); background: #16233A; border-radius: 4px; padding: 8px 10px; }
.demo[hidden] { display: none; }
.demo .top { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--fg3); font-family: var(--mono); }
.demo .top b { color: var(--blue); font-weight: 600; font-family: inherit; letter-spacing: .06em; }
.demo .ctl { margin-left: auto; display: flex; gap: 4px; }
.demo .ctl button { border: 1px solid var(--line); background: var(--panel2); color: var(--fg); border-radius: 3px; padding: 0 7px; cursor: pointer; font-size: 12px; line-height: 20px; white-space: nowrap; }
.demo .top { white-space: nowrap; }
.demo .ctl button:hover { border-color: var(--blue); }
.demo h3 { margin: 4px 0 2px; font-size: 15px; font-weight: 600; }
.demo p { margin: 0; color: var(--fg2); font-size: 12.5px; }
.demo .bar { height: 3px; background: var(--line2); border-radius: 2px; margin-top: 7px; overflow: hidden; }
.demo .bar i { display: block; height: 100%; background: var(--blue); transition: width .4s; }
.demo .links { margin-top: 6px; display: flex; gap: 6px; }
.node.focus rect { stroke: var(--blue); stroke-width: 2.5; filter: drop-shadow(0 0 9px rgba(76,144,240,.8)); }
.stream { flex: 1; min-height: 0; overflow: hidden; padding: 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 40px); mask-image: linear-gradient(to bottom, transparent 0, #000 40px); }
.ev { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 7px; flex: none; }
.ev.me { grid-template-columns: minmax(0, 1fr) 22px; }
.ev.me .av { order: 2; }
.av { width: 22px; height: 22px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 600; }
.bub { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--line)); border-radius: 3px; padding: 3px 8px; min-width: 0; }
.ev.me .bub { border-left: 1px solid var(--line); border-right: 3px solid var(--green); background: #1E2B24; }
.bub.warn { border-left-color: var(--orange); background: #2E261B; }
.bub .h { display: flex; gap: 6px; font-size: 11px; color: var(--fg3); }
.bub .h b { color: var(--fg2); font-weight: 600; }
.bub .h time { margin-left: auto; font-family: var(--mono); }
.bub .a { font-weight: 600; }
.bub .a .x { font-family: var(--mono); color: var(--blue); font-weight: 400; margin-left: 4px; }
.bub .d { color: var(--fg2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.stage { align-self: center; font-size: 11px; color: var(--blue); border: 1px solid #2D4A73; background: #18263A; border-radius: 3px; padding: 0 10px; font-family: var(--mono); flex: none; }
.new { animation: in .25s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
.empty { color: var(--fg3); text-align: center; margin: auto; padding: 16px; line-height: 1.8; }
@media (prefers-reduced-motion: reduce) { .new, .edge.on, .live i { animation: none; } }
</style>
</head>
<body>
<header>
  <span class="logo" aria-hidden="true"></span><h1>Agent 工作台</h1>
  <span class="sep"></span>
  <button class="tbtn" data-new="C01">＋ C01 一般</button><button class="tbtn" data-new="C02">＋ C02 共有</button><button class="tbtn" data-new="C03">＋ C03 易錯</button>
  <span class="sep"></span>
  <button class="tbtn demo" id="demoBtn" title="自動跑一遍完整流程，邊跑邊說明">▶ 自動展示</button>
  <span class="sep"></span>
  <span class="crumb" id="crumb">尚未選擇案例</span>
  <a class="tbtn" id="openFarmer" href="#" target="_blank" hidden>另開農民頁</a>
  <a class="tbtn" id="openReport" href="#" target="_blank" hidden>分析報告</a>
  <span class="live" id="live" hidden><i></i>即時</span>
</header>
<main>
  <section class="pane phonecol" id="phonecol"><h2>農民手機</h2><div class="phonebox" id="phonebox"><div class="phone" id="phoneframe"><iframe id="phone" title="農民手機頁" allow="microphone; autoplay"></iframe></div></div></section>
  <div class="mid">
    <div class="kpis" id="kpis"></div>
    <section class="pane graph"><h2>流程<span class="cnt" id="stageTxt"></span></h2><svg id="graph" viewBox="0 0 860 300" role="img" aria-label="agent 流程圖"></svg>
      <div class="legend"><span><i style="background:var(--fg3)"></i>等待</span><span><i style="background:var(--blue)"></i>進行中</span><span><i style="background:var(--green)"></i>完成</span><span><i style="background:var(--orange)"></i>有警示／待處理</span><span>虛線框＝農民本人</span></div></section>
    <section class="pane"><h2>物件：土地・地主・欄位主張<span class="cnt" id="objCnt"></span></h2><div class="objs" id="objs"><p class="empty">建立案例後，擷取出來的物件會出現在這裡。</p></div></section>
  </div>
  <section class="pane"><h2>Agent 事件串流<span class="cnt" id="evCnt"></span></h2><div class="demo" id="demo" hidden aria-live="polite"></div><div class="stream" id="stream" aria-live="polite">
    <p class="empty">按上面的「＋ C01／C02／C03」建立測試案例。<br>左邊是農民手機，中間是流程與物件，<br>這裡即時顯示每個 agent 做了什麼。</p></div></section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// 角色：名稱、縮寫、顏色、對應的流程節點
const WHO = {
  farmer: ["農民", "農", "#32A467", "farmer"],
  system: ["系統", "系", "#738091", null],
  "agent:intake": ["① 收件", "收", "#4C90F0", "intake"],
  "agent:extract": ["② 擷取", "擷", "#9881F3", "extract"],
  "agent:check": ["③ 核對", "核", "#EC9A3C", "check"],
  "agent:triage": ["④ 分派", "分", "#2EB5AD", "triage"],
  "agent:document": ["⑤ 文件", "文", "#D46BA3", "document"],
  "agent:report": ["⑥ 報告", "報", "#8EB125", "report"],
  "agent:faq": ["⑦ 服務台", "服", "#F0B726", "faq"],
};
const STAGE = { collecting: "收照片中", extracting: "擷取中", reviewing: "核對與回答中", documented: "已產生同意書", needs_human: "需要處理" };
const FIELD = { location: "坐落", lot_no: "地號", area_m2: "面積", owner: "地主", id_no: "身分證", share: "持分" };
const ST = { pending: "待確認", confirmed: "已確認", rejected: "退回" };

// 流程圖（蛇形：上排往右、下排往左）
const NODES = [
  { id: "photo", x: 20, y: 22, name: "農民拍照", human: true },
  { id: "intake", x: 190, y: 22, name: "① 收件 agent" },
  { id: "extract", x: 360, y: 22, name: "② 擷取 agent" },
  { id: "check", x: 530, y: 22, name: "③ 核對 agent" },
  { id: "triage", x: 700, y: 22, name: "④ 分派 agent" },
  { id: "farmer", x: 700, y: 132, name: "農民核對・回答", human: true },
  { id: "legal", x: 530, y: 132, name: "法律注意事項" },
  { id: "document", x: 360, y: 132, name: "⑤ 文件 agent" },
  { id: "report", x: 190, y: 132, name: "⑥ 報告 agent" },
  { id: "faq", x: 700, y: 232, name: "⑦ 服務台 agent" },
];
const EDGES = [["photo", "intake"], ["intake", "extract"], ["extract", "check"], ["check", "triage"], ["triage", "farmer"],
  ["farmer", "legal"], ["legal", "document"], ["document", "report"], ["farmer", "faq"]];
const W = 140, H = 56;

let caseId = new URLSearchParams(location.hash.slice(1)).get("case") || "";
let timer = null, token = "", flashNode = null, flashUntil = 0, lastEvCount = 0, lastMsgCount = 0;

async function newCase(sample) {
  const r = await fetch("../api/cases", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sample_id: sample }) });
  if (r.ok) location.hash = `case=${(await r.json()).id}`;
}

// ───── 手機依高度等比縮放
function fitPhone() {
  const box = $("#phonebox"), frame = $("#phoneframe");
  const s = Math.min(1, (box.clientHeight - 8) / 828);
  frame.style.transform = `scale(${s})`;
  frame.style.left = "6px"; frame.style.top = "4px";
  $("#phonecol").style.width = `${Math.ceil(391 * s) + 14}px`;
}
window.addEventListener("resize", fitPhone);

// ───── 流程圖
function nodeState(c, fv) {
  const ok = c.photos.filter((p) => p.ok && !p.retired).length, bad = c.photos.filter((p) => !p.ok).length;
  const claims = c.claims, flags = claims.reduce((n, x) => n + x.flags.length, 0);
  const qs = fv?.questions || [], answered = qs.filter((q) => q.id in (fv?.answers || {})).length;
  const legal = c.legal || [], asked = legal.filter((l) => l.asked).length;
  const asks = c.events.filter((e) => e.actor === "agent:faq").length;
  const reported = c.events.some((e) => e.actor === "agent:report");
  const docs = c.documents || [], draft = docs.some((d) => d.includes("草稿"));
  const s = c.stage, after = s !== "collecting";
  return {
    photo: [ok >= c.pages_expected || after ? "done" : s === "collecting" ? "run" : "", `${ok}/${c.pages_expected} 張`],
    intake: [bad && s === "collecting" ? "warn" : after ? "done" : ok || bad ? "run" : "", `通過 ${ok}・退回 ${bad}`],
    extract: [s === "extracting" ? "run" : claims.length ? "done" : "", claims.length ? `${claims.length} 個欄位` : "—"],
    check: [claims.length ? (flags ? "warn" : "done") : "", claims.length ? `警示 ${flags}` : "—"],
    triage: [claims.length ? "done" : "", qs.length && claims.length ? `${qs.length} 題` : "—"],
    farmer: [!claims.length ? "" : answered < qs.length ? "run" : "done", claims.length ? `已答 ${answered}/${qs.length}` : "—"],
    legal: [legal.length ? (asked ? "warn" : "done") : claims.length ? "done" : "", legal.length ? `${legal.length} 項・問 ${asked}` : claims.length ? "無" : "—"],
    document: [docs.length ? (draft ? "warn" : "done") : "", docs.length ? `${docs.length} 份・${draft ? "草稿" : "正式"}` : "—"],
    report: [reported ? "done" : "", reported ? "已產生" : "—"],
    faq: [asks ? "done" : "", `問答 ${asks}`],
  };
}
function graphSvg(state) {
  const pos = Object.fromEntries(NODES.map((n) => [n.id, n]));
  const edge = ([a, b]) => {
    const A = pos[a], B = pos[b];
    const d = A.y === B.y
      ? (B.x > A.x ? `M${A.x + W},${A.y + H / 2} L${B.x},${B.y + H / 2}` : `M${A.x},${A.y + H / 2} L${B.x + W},${B.y + H / 2}`)
      : `M${A.x + W / 2},${A.y + H} L${B.x + W / 2},${B.y}`;
    const sa = state[a]?.[0], sb = state[b]?.[0];
    const cls = sb === "run" || (sa === "run" && b !== "faq") ? "on" : sa === "done" && (sb === "done" || sb === "warn") ? "done" : "";
    return `<path class="edge ${cls}" d="${d}" marker-end="url(#arr)"/>`;
  };
  const node = (n) => {
    const [st, m] = state[n.id] || ["", "—"];
    const cls = `node ${st} ${n.human ? "human" : ""} ${flashNode === n.id && Date.now() < flashUntil ? "flash" : ""} ${DEMO.running && DEMO.node === n.id ? "focus" : ""}`;
    return `<g class="${cls}" transform="translate(${n.x},${n.y})"><rect width="${W}" height="${H}"/>
      <circle class="dot" cx="13" cy="17" r="4"/><text class="t" x="24" y="22">${esc(n.name)}</text><text class="m" x="13" y="43">${esc(m)}</text></g>`;
  };
  return `<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5F6B7C"/></marker></defs>${EDGES.map(edge).join("")}${NODES.map(node).join("")}`;
}

// ───── 物件卡片
function chips(c, target) {
  return c.claims.filter((x) => x.target === target).map((x) => {
    const st = !x.ai_value ? "unclear" : x.status;
    const mark = !x.ai_value ? "?" : x.status === "confirmed" ? "✓" : x.status === "rejected" ? "✕" : "!";
    const tip = `${x.id}｜${x.ai_value ? x.value : "（看不清）"}｜${ST[x.status] || x.status}｜第 ${x.source.page} 頁${x.flags.length ? "｜⚠ " + x.flags.join("；") : ""}`;
    return `<span class="f ${st}${x.flags.length ? " flagged" : ""}" title="${esc(tip)}">${mark} ${esc(FIELD[x.field] || x.field)}</span>`;
  }).join("");
}
function objsHtml(c) {
  if (!c.claims.length) return `<p class="empty">${c.stage === "extracting" ? "擷取中…" : "還沒有擷取結果（農民拍完照片後會出現）。"}</p>`;
  const val = (id) => c.claims.find((x) => x.id === id)?.value || "（看不清）";
  return c.parcels.map((p, i) => {
    const warns = [...new Set(c.claims.filter((x) => x.target === p.pid || x.target.startsWith(p.pid + "-")).flatMap((x) => x.flags))];
    const owners = c.ownerships.filter((o) => o.pid === p.pid).map((o) => `<div class="sub"><div class="oh"><b>地主</b><span class="id">${esc(o.oid)}</span>
      <span class="v">${esc(val(`${o.oid}-owner`))}・${esc(val(`${o.oid}-share`))}</span></div><div class="fields">${chips(c, o.oid)}</div></div>`).join("");
    return `<div class="obj"><div class="oh"><b>土地 ${i + 1}</b><span class="id">${esc(p.pid)}</span>
      <span class="v">${esc(val(`${p.pid}-lot_no`))}・${esc(val(`${p.pid}-area_m2`))} m²</span></div>
      <div class="fields">${chips(c, p.pid)}</div>${owners}
      ${warns.length ? `<div class="warnline" title="${esc(warns.join("；"))}">⚠ ${esc(warns[0])}${warns.length > 1 ? `（另 ${warns.length - 1} 項）` : ""}</div>` : ""}</div>`;
  }).join("");
}

function kpisHtml(c, fv) {
  const conf = c.claims.filter((x) => x.status === "confirmed").length;
  const qs = fv?.questions || [], ans = qs.filter((q) => q.id in (fv?.answers || {})).length;
  const meter = (a, b) => `<div class="meter"><i style="width:${b ? Math.round((a / b) * 100) : 0}%"></i></div>`;
  const k = (label, v, sub = "", extra = "") => `<div class="kpi"><small>${label}</small><b>${v}</b><span>${sub}</span>${extra}</div>`;
  return `<div class="kpi"><small>階段</small><b class="txt">${esc(STAGE[c.stage] || c.stage)}</b></div>`
    + k("欄位已確認", `${conf}/${c.claims.length}`, "", meter(conf, c.claims.length))
    + k("題目已答", `${ans}/${qs.length}`, "", meter(ans, qs.length))
    + k("不能出正式版", (c.missing || []).length, "項") + k("事件", c.events.length, "筆");
}

// ───── 事件串流：紀錄 → 訊息，再把同類合併
function toMsgs(e) {
  if (e.action === "上傳照片") {
    const m = e.detail.match(/^第 (\d+) 頁：(.*)$/), pass = m && m[2].startsWith("通過");
    return [{ actor: "farmer", act: "拍了一張照片", det: m ? `第 ${m[1]} 頁` : "" },
      { actor: "agent:intake", act: pass ? "照片可以用" : "照片退回", det: m ? m[2] : e.detail, warn: !pass }];
  }
  if (e.action === "改變階段") return [{ stage: STAGE[e.detail.split(" ")[0]] || e.detail }];
  if (e.action === "回答農民的問題") {
    const m = e.detail.match(/^(語音|按鈕)：「(.*)」→ (.+)$/);
    if (m) return [{ actor: "farmer", act: `問問題（${m[1]}）`, det: m[2] },
      { actor: "agent:faq", act: "回答", det: m[3] === "fallback" ? "答案庫沒有 → 老實說不會" : m[3] === "legal" ? "法律問題 → 不判斷，請他問地政事務所或農會" : `答案庫：${m[3]}` }];
  }
  return [{ actor: e.actor, act: e.action, det: e.detail, warn: ["加註警示", "退回欄位"].includes(e.action) }];
}
const CLAIM_ACTS = { "確認欄位": "確認", "退回欄位": "退回", "欄位改回待確認": "改回待確認" };
function groupMsgs(events) {
  const out = [];
  for (const e of events) {
    const t = new Date(e.at).toLocaleTimeString("zh-TW", { hour12: false });
    for (const m of toMsgs(e)) {
      m.t = t;
      const prev = out[out.length - 1];
      // 農民回答核對題後的「確認欄位」併進那一則回答
      if (CLAIM_ACTS[m.act] && prev && prev.actor === "farmer" && prev.act === "回答問題") {
        prev.claims = (prev.claims || 0) + 1; prev.claimAct = CLAIM_ACTS[m.act]; continue;
      }
      // 連續同一個角色做同一件事：合成一則（×N）
      if (prev && !m.stage && prev.actor === m.actor && prev.act === m.act && m.act !== "回答問題") {
        prev.n = (prev.n || 1) + 1; prev.dets = [...(prev.dets || [prev.det]), m.det]; prev.t = t; continue;
      }
      out.push(m);
    }
  }
  return out;
}
function evHtml(m, isNew) {
  if (m.stage) return `<div class="stage${isNew ? " new" : ""}">▸ 階段：${esc(m.stage)}</div>`;
  const [name, short, color] = WHO[m.actor] || [m.actor, "?", "#738091"];
  const det = m.n ? m.dets.filter(Boolean).join("；") : m.det;
  const extra = m.claims ? `→ ${m.claimAct} ${m.claims} 個欄位` : "";
  return `<div class="ev ${m.actor === "farmer" ? "me" : ""}${isNew ? " new" : ""}"><span class="av" style="background:${color}">${esc(short)}</span>
    <div class="bub${m.warn ? " warn" : ""}" style="--c:${color}"><div class="h"><b>${esc(name)}</b><time>${esc(m.t)}</time></div>
    <div class="a">${esc(m.act)}${m.n ? `<span class="x">×${m.n}</span>` : ""}</div>
    ${det || extra ? `<div class="d" title="${esc(det)}">${esc(det)}${det && extra ? " " : ""}${esc(extra)}</div>` : ""}</div></div>`;
}

// ───── 更新
function start() {
  clearInterval(timer);
  token = ""; lastEvCount = 0; lastMsgCount = 0;
  $("#phone").removeAttribute("src");
  fitPhone();
  if (!caseId) return;
  $("#crumb").textContent = `案例 / ${caseId}`;
  $("#live").hidden = false;
  $("#stream").innerHTML = `<p class="empty">讀取中…</p>`;
  poll();
  timer = setInterval(poll, 1500);
}

async function poll() {
  const id = caseId; // 換案例後，舊案例晚回來的結果要丟掉（不然手機會被切回舊案例）
  if (!id) return;
  let c, fv = null;
  try {
    const r = await fetch(`../api/cases/${encodeURIComponent(id)}`, { cache: "no-store" });
    if (id !== caseId) return;
    if (!r.ok) { $("#stream").innerHTML = `<p class="empty">找不到案例 ${esc(id)}</p>`; clearInterval(timer); return; }
    c = await r.json();
    const f = await fetch(`../api/f/${c.farmer_token}`, { cache: "no-store" });
    if (f.ok) fv = await f.json();
  } catch { return; }
  if (id !== caseId || c.id !== caseId) return;
  if (token !== c.farmer_token) {
    token = c.farmer_token;
    $("#phone").src = `farmer.html#t=${token}`;
    $("#openFarmer").href = `farmer.html#t=${token}`; $("#openFarmer").hidden = false;
    $("#openReport").href = `../api/f/${token}/report`;
  }
  $("#openReport").hidden = !fv?.report;
  const ev = c.events;
  if (ev.length !== lastEvCount) {
    const msgs = groupMsgs(ev);
    const fresh = Math.max(0, msgs.length - lastMsgCount);
    // 只放得下的最後幾十則；舊的從頂部淡出
    $("#stream").innerHTML = msgs.slice(-40).map((m, i, arr) => evHtml(m, i >= arr.length - fresh && lastEvCount > 0)).join("");
    const last = [...msgs].reverse().find((m) => m.actor);
    const node = last && (last.actor === "farmer" ? (c.claims.length ? "farmer" : "photo") : WHO[last.actor]?.[3]);
    if (node && lastEvCount > 0) { flashNode = node; flashUntil = Date.now() + 2500; }
    lastEvCount = ev.length; lastMsgCount = msgs.length;
  }
  $("#evCnt").textContent = `${ev.length} 筆紀錄`;
  $("#stageTxt").textContent = STAGE[c.stage] || c.stage;
  $("#kpis").innerHTML = kpisHtml(c, fv);
  $("#graph").innerHTML = graphSvg(nodeState(c, fv));
  $("#objs").innerHTML = objsHtml(c);
  $("#objCnt").textContent = `${c.parcels.length} 筆土地・${c.ownerships.length} 位地主・${c.claims.length} 個主張（滑鼠停在標籤上看值）`;
}

// ───── 自動展示：自己操作左邊的農民頁，跑完整個流程，右上說明卡逐步解說
const DEMO = { running: false, paused: false, skip: false, node: null, step: 0 };
const STOP = new Error("stop");
const DEMO_STEPS = 14;
const DEMO_PLAN = { q1: "yes", q2: "other", q3: "承租", "L-lease": "yes", "L-lease-375": "no", "L-coowner": "yes", "L-coowner-reach": "yes", period: "3" };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const norm = (t) => String(t || "").replace(/\s+/g, "");
const fdoc = () => $("#phone").contentDocument;

async function hold(ms) { // 等一下；可暫停、可按「下一步」跳過
  for (let left = ms; left > 0;) {
    if (!DEMO.running) throw STOP;
    if (DEMO.skip) { DEMO.skip = false; return; }
    await sleep(100);
    if (!DEMO.paused) left -= 100;
  }
}
async function until(fn, ms = 20000) {
  for (const t = Date.now(); Date.now() - t < ms;) {
    if (!DEMO.running) throw STOP;
    const r = fn();
    if (r) return r;
    await sleep(200);
  }
  throw new Error("等太久了");
}
const findBtn = (pred) => [...(fdoc()?.querySelectorAll("button, a") || [])].find((b) => !b.disabled && pred(norm(b.textContent)));
async function tap(text, exact = false) {
  const b = await until(() => findBtn((t) => (exact ? t === norm(text) : t.startsWith(norm(text)))));
  b.click();
}
function say(title, body, node) {
  DEMO.step += 1; DEMO.node = node;
  const box = $("#demo");
  box.hidden = false;
  box.innerHTML = `<div class="top"><b>自動展示</b><span>${Math.min(DEMO.step, DEMO_STEPS)} / ${DEMO_STEPS}</span>
    <span class="ctl"><button data-demo="pause">${DEMO.paused ? "▶ 繼續" : "⏸ 暫停"}</button><button data-demo="next">⏭ 下一步</button><button data-demo="stop">⏹ 結束</button></span></div>
    <h3>${esc(title)}</h3><p>${esc(body)}</p><div class="bar"><i style="width:${Math.round((Math.min(DEMO.step, DEMO_STEPS) / DEMO_STEPS) * 100)}%"></i></div>`;
  if (caseId) poll();
}
async function devPhoto(kind) { // 用農民頁的本機測試按鈕送假謄本
  const sel = await until(() => fdoc()?.querySelector("#devCase"));
  sel.value = "C02"; sel.dispatchEvent(new Event("change", { bubbles: true }));
  await tap(kind);
}
async function farmerView() { return (await fetch(`../api/f/${token}`, { cache: "no-store" })).json(); }

async function runDemo() {
  DEMO.running = true; DEMO.paused = false; DEMO.skip = false; DEMO.step = 0;
  $("#demoBtn").textContent = "展示中…";
  try {
    say("一、建立案例", "幫一位地主開一個案子（假謄本 C02：一筆地、兩位地主共有）。農民只會收到一個專屬連結，不用帳號密碼。", "photo");
    const r = await fetch("../api/cases", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sample_id: "C02" }) });
    const made = await r.json();
    location.hash = `case=${made.id}`;
    // 確定手機已經換成這個新案例，才開始操作
    await until(() => token === made.farmer_token && fdoc()?.location.hash.includes(made.farmer_token) && findBtn((t) => t.startsWith("開始")));
    await hold(3500);

    say("二、阿伯先說明要做什麼", "高齡農民的畫面：大字、大按鈕、一次一件事，每句話都能聽（OpenAI 語音）。按「開始」。", "photo");
    await hold(2500); await tap("開始"); await hold(1500);

    say("三、拍照：① 收件 agent 當場檢查", "故意拍一張又暗又糊的照片。收件 agent 立刻退回，用農民聽得懂的話說「照片有點暗」，不會等到隔天才退件。", "intake");
    await devPhoto("壞照片"); await hold(4500);

    say("四、重拍，這次清楚", "拍清楚的第 1 頁、第 2 頁。每張都會列出「夠亮、清楚」，通過就自動往下，不用另外按。", "intake");
    await devPhoto("第1頁"); await hold(3500);
    await devPhoto("第2頁");

    say("五、② 擷取 → ③ 核對 → ④ 分派", "擷取 agent 讀出土地與地主，所有欄位都先標「待確認」——AI 不能自己確認。核對 agent 比對內政部段名清單、加註警示；分派 agent 排出要問農民的題目。", "extract");
    await until(() => findBtn((t) => t.startsWith("開始回答")), 30000);
    await hold(4000);
    DEMO.node = "check"; poll(); await hold(2500);
    DEMO.node = "triage"; poll(); await hold(2000);
    await tap("開始回答"); await hold(1200);

    // 一題一題回答
    let asked = false, legalTold = false;
    for (let guard = 0; guard < 20; guard++) {
      const fv = await farmerView();
      const q = fv.questions.find((x) => !(x.id in fv.answers));
      if (!q) break;
      const value = q.id.startsWith("C-") ? "yes" : DEMO_PLAN[q.id] ?? "yes";
      const label = q.options.find((o) => o.value === value)?.label || q.options[0].label;
      if (q.id === "q1") say("六、這是你的地嗎？", "用「認得出來」代替「記得起來」：列出謄本上的地號與面積，附上他自己拍的照片。", "farmer");
      else if (q.id.startsWith("C-") && !DEMO.toldCheck) { DEMO.toldCheck = true; say("七、農民自己核對", "沒有協助者：每筆地、每位地主一張卡，拿紙本對對看，答「一樣」才算確認。核對 agent 的警示也用農民的說法顯示在卡片上。", "farmer"); }
      else if (q.id === "q2") {
        if (!asked) {
          asked = true;
          say("八、⑦ 服務台：不懂可以直接問", "農民按同一顆麥克風問「為什麼要一樣？」，阿伯從固定答案庫回答，不讓 AI 自由說話；問到法律就請他問地政事務所或農會。", "faq");
          await fetch(`../api/f/${token}/ask`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: "為什麼要一樣？", channel: "voice" }) });
          await hold(3500);
          await fetch(`../api/f/${token}/ask`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: "這樣簽會不會有法律問題？", channel: "voice" }) });
          await hold(3500);
        }
        say("九、誰在種、怎麼種", "回答「別人」在種、「承租」。這兩個答案會讓法律注意事項的分數改變。", "farmer");
      } else if (q.legal && !legalTold) {
        legalTold = true;
        say("十、法律注意事項：只問最可能的", "agent 用固定規則算分（承租 90、共有土地 55），只問分數最高的幾題；答「有租約」再追問「是三七五嗎」。這是提醒不是判斷，法條都標「待法律專業確認」。", "legal");
      } else if (q.id === "period") say("十一、選要簽幾年", "實施期間用大按鈕選 1／3／5 年，不用打字。耕作人的名字和身分證號留白，簽的時候手寫。", "farmer");
      await hold(q.id.startsWith("C-") ? 1500 : 3000);
      await tap(label, true);
      for (let k = 0; k < 40; k++) { const v = await farmerView(); if (q.id in v.answers) break; await sleep(250); }
      await hold(1600);
    }

    say("十二、⑤ 文件 agent：產生同意書", "題目答完自動產生「土地使用同意書」：依紙本版面，公頃面積用確認過的數字換算，法律提醒寫進備註；還有沒處理的就標「草稿」。", "document");
    await hold(4500);
    say("十三、⑥ 報告 agent：土地分析報告", "同時產生白話的分析報告：土地與面積、地主與持分、農民的回答、法律注意事項的分數與理由、還要處理的事。", "report");
    await hold(4500);
    say("十四、完成", "全程沒有協助者，也沒有讓 AI 自己確認任何欄位。右邊是每個 agent 做過的事，可以下載同意書和分析報告。", "report");
    $("#demo").insertAdjacentHTML("beforeend", `<div class="links"><a class="tbtn" href="../api/f/${token}/report" target="_blank">下載分析報告</a><a class="tbtn" href="farmer.html#t=${token}" target="_blank">另開農民頁</a></div>`);
  } catch (err) {
    if (err !== STOP) {
      $("#demo").hidden = false;
      $("#demo").insertAdjacentHTML("beforeend", `<p style="color:var(--orange);margin-top:6px">展示中斷：${esc(err.message || err)}。可以按「▶ 自動展示」重來。</p>`);
    } else $("#demo").hidden = true;
  } finally {
    DEMO.running = false; DEMO.node = null; DEMO.toldCheck = false;
    $("#demoBtn").textContent = "▶ 自動展示";
  }
}
$("#demoBtn").addEventListener("click", () => { if (!DEMO.running) runDemo(); });
document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-demo]");
  if (!d) return;
  if (d.dataset.demo === "pause") { DEMO.paused = !DEMO.paused; d.textContent = DEMO.paused ? "▶ 繼續" : "⏸ 暫停"; }
  if (d.dataset.demo === "next") DEMO.skip = true;
  if (d.dataset.demo === "stop") DEMO.running = false;
});
document.addEventListener("click", (e) => { const b = e.target.closest("[data-new]"); if (b) newCase(b.dataset.new); });
window.addEventListener("hashchange", () => { caseId = new URLSearchParams(location.hash.slice(1)).get("case") || ""; start(); });
start();
</script>
