<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF7">
<title>土地謄本</title>
<!-- 設計見 docs/frontend-design.md。資料只走 /api/f/{token}，不顯示身分證號。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #FFFDF7; --fg: #2B2118; --fg2: #5C4A36; --line: #DCD2BE; --track: #E9E1D0;
  --g: #4A9A2E; --gd: #357322; --gl: #DDF0D0; --gt: #27500A;
  --wb: #FAEEDA; --wt: #854F0B;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
/* 粉圓體只有 400 一種粗細：全部用 400，層次靠大小和顏色，不讓瀏覽器假加粗 */
body { font-family: "Huninn", "jf-openhuninn", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  font-weight: 400; font-synthesis: none; font-size: 20px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 4px solid #1F5FAD; outline-offset: 3px; }
#app { max-width: 480px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column;
  padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); }
body.sheet-open #app { padding-bottom: 260px; }
#main { flex: 1; display: flex; flex-direction: column; gap: 14px; }

/* 整體步驟：拍照 → 等一下 → 核對 → 回答 → 下載 */
.steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; }
.steps li { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 16px; color: var(--fg2); white-space: nowrap;
  position: relative; }
.steps li + li::before { content: ""; position: absolute; top: 14px; right: calc(50% + 18px); width: calc(100% - 32px);
  height: 3px; background: var(--track); border-radius: 2px; }
.steps li.done + li::before { background: var(--g); }
.steps .n { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--track); color: var(--fg2); font-size: 17px; }
.steps .n svg { width: 20px; height: 20px; }
.steps .done .n { background: var(--g); color: #fff; }
.steps .done { color: var(--gt); }
.steps .now .n { background: var(--gl); color: var(--gt); box-shadow: 0 0 0 3px var(--g); }
.steps .now { color: var(--gt); }

.top { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.bar { flex: 1; height: 18px; border-radius: 9px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--g); border-radius: 9px; transition: width .5s ease-out; }

.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 64px; padding: 8px 16px;
  border-radius: 16px; border: 2px solid var(--line); border-bottom-width: 6px; background: #fff; color: var(--fg);
  font: inherit; font-size: 23px; cursor: pointer; text-decoration: none; transition: border-bottom-width .08s, margin-top .08s; }
.btn:active { border-bottom-width: 2px; margin-top: 4px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 30px; height: 30px; flex: none; }
.pri { background: var(--g); border-color: var(--gd); color: #fff; }
.soft { font-size: 21px; color: var(--fg2); }
.back { width: 56px; min-height: 56px; padding: 0; flex: none; }
.row { display: flex; gap: 12px; }
.row > .btn { flex: 1; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid .btn { flex-direction: column; min-height: 112px; gap: 4px; }
.grid .btn svg { width: 42px; height: 42px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack .btn { min-height: 76px; font-size: 25px; }
.dock { position: sticky; bottom: 0; padding: 8px 0 4px; background: var(--bg); }

.who { display: flex; gap: 12px; align-items: flex-start; }
.mascot { width: 76px; flex: none; }
.bubble { position: relative; flex: 1; background: #fff; border: 2px solid var(--line); border-radius: 18px;
  padding: 12px 14px; font: inherit; text-align: left; color: var(--fg); cursor: pointer; min-height: 64px; }
.bubble::before { content: ""; position: absolute; left: -11px; top: 24px; border: 10px solid transparent;
  border-right-color: var(--line); border-left: 0; }
.bubble .tag { display: inline-block; font-size: 16px; color: var(--fg2); border: 2px solid var(--line); border-radius: 999px;
  padding: 0 10px; margin-bottom: 4px; background: var(--bg); }
.bubble .t { display: block; font-size: 27px; line-height: 1.35; }
.bubble .s { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 18px; color: var(--fg2); }
.bubble .s svg { width: 22px; height: 22px; color: var(--g); flex: none; }
.why { display: flex; gap: 8px; align-items: flex-start; margin: -4px 0 0 88px; color: var(--fg2); font-size: 20px; }
.why svg { width: 24px; height: 24px; flex: none; margin-top: 3px; color: var(--fg2); }

.card { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.card h2 { font-size: 22px; font-weight: 400; color: var(--fg2); margin: 0 0 6px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.list li { display: flex; align-items: center; gap: 12px; }
.list li svg { width: 30px; height: 30px; flex: none; color: var(--g); }
.list .num { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--gl); color: var(--gt);
  display: flex; align-items: center; justify-content: center; font-size: 18px; }

.lands { display: flex; flex-direction: column; gap: 8px; }
.land { display: flex; gap: 12px; align-items: center; background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px 10px 14px; }
.land .txt { flex: 1; min-width: 0; }
.land small { display: block; font-size: 18px; color: var(--fg2); }
.land b { display: block; font-weight: 400; font-size: 30px; letter-spacing: .02em; line-height: 1.3; }
.land .area { display: block; font-size: 20px; color: var(--fg); }
.thumbbtn { flex: none; width: 84px; min-height: 56px; padding: 4px; border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 12px;
  background: #fff; font: inherit; font-size: 16px; color: var(--fg2); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.thumbbtn:active { border-bottom-width: 2px; }
.thumbbtn img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; background: #F3EEE3; }

/* 核對題的謄本卡：標籤小、內容大；看不清的用琥珀色＋問號，不用紅色 */
.chk { display: flex; gap: 12px; align-items: flex-start; }
.chk dl { flex: 1; min-width: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.chk dt { font-size: 18px; color: var(--fg2); }
.chk dd { margin: 0; font-size: 28px; line-height: 1.3; overflow-wrap: anywhere; }
.chk dd.unclear { display: inline-flex; align-items: center; gap: 6px; color: var(--wt); background: var(--wb); border-radius: 10px;
  padding: 2px 10px; font-size: 24px; }
.chk dd.unclear svg { width: 26px; height: 26px; flex: none; }

.thumbs { display: flex; gap: 10px; flex-wrap: wrap; }
.thumbs figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 16px; color: var(--gt); }
.thumbs img { width: 76px; height: 100px; object-fit: cover; border-radius: 10px; border: 2px solid var(--g); background: #F3EEE3; }
.thumbs span { display: flex; align-items: center; gap: 2px; }
.thumbs svg { width: 18px; height: 18px; }

.tips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tips div { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 8px 4px; display: flex; flex-direction: column;
  align-items: center; text-align: center; gap: 2px; font-size: 20px; line-height: 1.3; }
.tips svg { width: 34px; height: 34px; color: var(--g); }

.note { background: var(--wb); color: var(--wt); border-radius: 14px; padding: 12px 14px; }
.draft { display: inline-block; font-size: 20px; color: var(--wt); background: var(--wb); border: 2px solid #E3C48F; border-radius: 999px;
  padding: 0 14px; }
.todo li svg { color: var(--wt); }
.small { font-size: 20px; color: var(--fg2); margin: 8px 0 0; }
.dl { display: flex; flex-direction: column; gap: 12px; }
.heard { font-size: 18px; color: var(--fg2); }
.center { text-align: center; }
.h1 { font-size: 30px; font-weight: 400; margin: 0; line-height: 1.3; }
.h1.sm { font-size: 26px; }
.say { font-size: 21px; color: var(--fg2); margin: 0; }
.spacer { flex: 1; }
.mid { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0; text-align: center; }
.big-mascot { width: 120px; }

.mic { width: 112px; height: 112px; border-radius: 50%; background: var(--g); color: #fff; display: flex;
  align-items: center; justify-content: center; animation: breath 1.6s ease-in-out infinite; }
.mic svg { width: 56px; height: 56px; }
@keyframes breath { 0%, 100% { box-shadow: 0 0 0 0 rgba(74, 154, 46, .45); } 50% { box-shadow: 0 0 0 22px rgba(74, 154, 46, 0); } }
.rb { font-size: 56px; line-height: 1.2; }
.rb.long { font-size: 34px; }

.view { position: relative; aspect-ratio: 3 / 4; max-height: 34vh; width: 100%; border: 3px dashed var(--line); border-radius: 18px;
  background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  color: var(--fg2); overflow: hidden; }
.view svg { width: 64px; height: 64px; }
.view img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #F3EEE3; }
.scan { position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--g); animation: scan 1.1s ease-in-out infinite alternate; }
@keyframes scan { to { top: calc(100% - 5px); } }

/* 拍完的結果：照片＋檢查清單 */
.result { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: start; }
.result img { width: 120px; height: 160px; object-fit: contain; border-radius: 12px; border: 2px solid var(--line); background: #F3EEE3; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checks li { display: flex; align-items: center; gap: 10px; font-size: 22px; line-height: 1.3; }
.checks li svg { width: 32px; height: 32px; flex: none; }
.checks .ok { color: var(--gt); }
.checks .ok svg { color: var(--g); }
.checks .warn { color: var(--wt); }
.advice { display: flex; flex-direction: column; gap: 6px; }
.advice div { display: flex; gap: 8px; align-items: flex-start; font-size: 20px; color: var(--fg2); background: #fff;
  border: 2px solid var(--line); border-radius: 14px; padding: 8px 12px; }
.advice svg { width: 26px; height: 26px; flex: none; margin-top: 2px; }

.sum { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.sum div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--track); padding-bottom: 6px; }
.sum div:last-child { border-bottom: 0; padding-bottom: 0; }
.sum dt { color: var(--fg2); font-size: 20px; }
.sum dd { margin: 0; font-size: 23px; color: var(--gt); flex: none; }

.dots { display: inline-flex; gap: 10px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--g); opacity: .3; animation: fade 1.5s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .25s; }
.dots i:nth-child(3) { animation-delay: .5s; }
@keyframes fade { 50% { opacity: 1; } }

.fwd { animation: inR .3s ease-out; }
.bk { animation: inL .3s ease-out; }
@keyframes inR { from { opacity: 0; transform: translateX(16px); } }
@keyframes inL { from { opacity: 0; transform: translateX(-16px); } }
.pop { animation: pop .3s ease-out; }
@keyframes pop { from { opacity: 0; transform: scale(.7); } }
.check path { stroke-dasharray: 70; stroke-dashoffset: 70; animation: draw .4s .1s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; transform: translateY(105%); transition: transform .3s ease-out; }
#sheet.up { transform: none; }
#sheet.ok { background: var(--gl); color: var(--gt); }
#sheet.warn { background: var(--wb); color: var(--wt); }
#sheet .in { max-width: 480px; margin: 0 auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 12px; }
#sheet .title { display: flex; align-items: center; gap: 10px; font-size: 27px; }
#sheet .title svg { width: 40px; height: 40px; flex: none; }
#sheet .body { font-size: 21px; margin: 0; }

/* 看大張照片：只用點的，按「關閉」回去 */
#zoom { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column; gap: 12px;
  padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
#zoom[hidden] { display: none; }
#zoom img { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #F3EEE3; border-radius: 12px; }
#zoom .btn { max-width: 480px; margin: 0 auto; }

/* 本機測試用面板（正式網址不會出現） */
#dev { margin-top: 20px; border: 2px dashed #9C8E78; border-radius: 12px; padding: 10px; font-size: 15px; color: var(--fg2);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#dev[hidden] { display: none; }
#dev b { font-weight: 400; width: 100%; }
#dev select, #dev button { font: inherit; font-size: 15px; min-height: 40px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--fg); }

/* 服務台：隨時可以按「問問題」，阿伯回答 */
#askrow { display: flex; justify-content: flex-end; margin-bottom: 8px; }
#askrow[hidden] { display: none; }
#askrow .btn { width: auto; min-height: 56px; font-size: 20px; padding: 6px 18px; }
#desk { position: fixed; inset: 0; z-index: 9; background: var(--bg); overflow-y: auto;
  padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
#desk[hidden] { display: none; }
#desk .in { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
#desk .h1 { font-size: 26px; }
.log { display: flex; flex-direction: column; gap: 8px; }
.log p { margin: 0; padding: 8px 12px; max-width: 85%; font-size: 19px; }
.log .me { align-self: flex-end; background: var(--gl); color: var(--gt); border-radius: 16px 16px 4px 16px; }
.log .bot { align-self: flex-start; background: #fff; border: 2px solid var(--line); border-radius: 16px 16px 16px 4px; color: var(--fg2); }
.chips { display: flex; flex-direction: column; gap: 10px; }
.chips .btn { font-size: 20px; justify-content: flex-start; }

@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
  .check path { stroke-dashoffset: 0; }
  .dots i { opacity: .7; }
}
</style>
</head>
<body>
<div id="app"><div id="askrow" hidden><button class="btn" data-act="deskOpen"></button></div><main id="main" aria-live="polite"></main><aside id="dev" hidden></aside></div>
<div id="desk" role="dialog" aria-modal="true" aria-label="問問題" hidden></div>
<div id="sheet" role="status"><div class="in"></div></div>
<div id="zoom" role="dialog" aria-modal="true" aria-label="謄本照片" hidden></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<script type="module">
import * as V from "./voice.js";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const token = new URLSearchParams(location.hash.slice(1)).get("t") || "";
const API = `../api/f/${encodeURIComponent(token)}`;
const IS_LOCAL = ["localhost", "127.0.0.1", "[::1]", "::1"].includes(location.hostname);
// 只接受站內路徑或剛拍的照片，避免後端字串變成奇怪的網址
const safeUrl = (u) => (typeof u === "string" && /^(\/(?!\/)|\.\.?\/|blob:)/.test(u) ? u : "");

// ───── 圖示（線條，跟著文字顏色）
const ICON = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.8-.9 1.5v.5M12 17v.01"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>',
  left: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
  right: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  volume: '<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
  self: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>',
  other: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20.5a6.5 6.5 0 0 1 13 0M15.5 4.8a3.5 3.5 0 0 1 0 6.4M18 14a6.5 6.5 0 0 1 3.5 6.5"/>',
  lease: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  tractor: '<circle cx="7" cy="17" r="3"/><circle cx="18" cy="18" r="2"/><path d="M4 14V8h6l2 6h7v3M10 17h6M7 8V5"/>',
  rotate: '<path d="M19.5 11A7.5 7.5 0 0 0 5.6 7.5M4.5 4v3.5H8M4.5 13a7.5 7.5 0 0 0 13.9 3.5M19.5 20v-3.5H16"/>',
  split: '<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M12 4.5v15"/>',
  stop: '<rect x="7" y="7" width="10" height="10" rx="1.5"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
  hand: '<path d="M8 11.5V6a1.5 1.5 0 0 1 3 0v5M11 10.5V4.5a1.5 1.5 0 0 1 3 0V10.5M14 10.5V6a1.5 1.5 0 0 1 3 0v6.5M17 10a1.5 1.5 0 0 1 3 0v5a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-5-2.7L4.3 14.6a1.5 1.5 0 0 1 2.4-1.8L8 14.5"/>',
  doc: '<path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M9 12h6M9 16h6"/>',
  corners: '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  download: '<path d="M12 3.5v11.5M7 10.5l5 5 5-5M4.5 19.5h15"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  search: '<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/>',
  print: '<path d="M7 9V3.5h10V9M7 17H4.5V10a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1v7H17"/><path d="M7 14h10v6.5H7z"/>',
  pen: '<path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5 4 20z"/><path d="M13.5 7l3 3"/>',
  ok: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
};
const ic = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n] || ICON.ok}</svg>`;

// ───── 斗笠阿伯：talk 唸題目、listen 在聽、happy 記好了、calm 出狀況時也是笑笑的
function mascot(mood = "talk", cls = "mascot") {
  const eyes = mood === "happy"
    ? '<path d="M22 46q3.5-4 7 0M35 46q3.5-4 7 0" stroke="#2B2118" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
    : '<circle cx="25.5" cy="45" r="2.8" fill="#2B2118"/><circle cx="38.5" cy="45" r="2.8" fill="#2B2118"/>';
  const mouth = mood === "happy" ? '<path d="M24 53q8 7 16 0" stroke="#2B2118" stroke-width="2.6" fill="none" stroke-linecap="round"/>'

    : mood === "listen" ? '<path d="M28 55h8" stroke="#2B2118" stroke-width="2.6" stroke-linecap="round"/>'
    : '<ellipse cx="32" cy="55" rx="4.5" ry="3.5" fill="#8A3B2A"/>';
  const ear = mood === "listen" ? '<path d="M55 41a8 8 0 0 1 0 12M59 37a13 13 0 0 1 0 20" stroke="#4A9A2E" stroke-width="2.6" fill="none" stroke-linecap="round"/>' : "";
  return `<svg class="${cls}" viewBox="0 0 64 72" aria-hidden="true">
    <circle cx="32" cy="47" r="19" fill="#F3CFA6"/>

    <path d="M14 33h36" stroke="#9C7A2A" stroke-width="2"/>

}

// ───── 題目
// q1–q3 唸的句子必須和 web/audio/prompts.json 一樣，才會播 Qwen3 TTS 音檔。
// 後端有給 questions 就照後端（題目會變多，例如 L-lease、L-coowner）；沒給就用這 3 題。
const LOCAL = {
  q1: { kind: "yesno", text: "這幾筆是你的地嗎？", say: "這幾筆，是你的地嗎？請說，是，或是，不是。", hint: "說「是」或「不是」",
    options: ["yes", "no", "unsure"] },
  q2: { kind: "who", text: "這些地是誰在種？", say: "這些地，是誰在種？是你自己，還是別人？", hint: "說「我自己」或「別人」",
    options: ["self", "other", "unsure"] },
  q3: { kind: "cat", text: "用什麼方式給人種？", say: "用什麼方式給人種？承租、託耕、輪耕，還是分耕？", hint: "說「承租」「託耕」「輪耕」或「分耕」",
    options: ["承租", "託耕", "輪耕", "分耕", "unsure"] },
};
const ICON_FOR = { yes: "check", no: "x", self: "self", other: "other", 承租: "lease", 託耕: "tractor", 輪耕: "rotate", 分耕: "split" };
const optIcon = (q, o) => (q.kind === "years" ? "calendar" : ICON_FOR[o.value] || (V.isNegative(o.label) ? "x" : "check"));

function normQ(sq) {
  const loc = LOCAL[sq.id] || {};
  const raw = Array.isArray(sq.options) ? sq.options : [];
  let options;
  if (loc.options && (!raw.length || typeof raw[0] !== "object")) {
    options = loc.options.map((v) => ({ value: v, label: V.LABEL[v] })); // 舊後端只給代碼：用本地順序
  } else {
    options = raw.map((o) => (typeof o === "object" && o
      ? { value: String(o.value), label: String(o.label ?? V.LABEL[o.value] ?? o.value) }
      : { value: String(o), label: V.LABEL[o] ?? String(o) }));
  }
  if (!options.some((o) => o.value === "unsure")) options.push({ value: "unsure", label: V.LABEL.unsure }); // 每題都要有「我不確定」
  const main = options.filter((o) => o.value !== "unsure");
  const kind = sq.kind || loc.kind || "";
  const years = kind === "years";
  return {
    id: String(sq.id),
    kind,
    text: sq.text || loc.text || "",
    say: loc.say || sq.say || sq.text || "",
    hint: loc.hint || (years && main.every((o) => /^\d+$/.test(o.value)) ? `說「${main.map((o) => `${o.value} 年`).join("」「")}」`
      : main.length ? `說「${main.map((o) => o.label).join("」或「")}」` : ""),
    why: sq.why || "",
    legal: Boolean(sq.legal),
    card: normCard(sq.card),
    options, main,
    unsure: options.find((o) => o.value === "unsure"),
    stack: years, // 選年數：三顆大按鈕上下排
    grid: main.length > 2 && !years,
  };
}
// 核對題的謄本卡：{ rows: [{label, value}], photo_page }；格式不對就當沒有
function normCard(c) {
  if (!c || typeof c !== "object" || !Array.isArray(c.rows)) return null;
  const rows = c.rows.filter((r) => r && typeof r === "object").map((r) => ({ label: String(r.label ?? ""), value: String(r.value ?? "") }));
  const pg = Number(c.photo_page);
  return rows.length ? { rows, page: c.photo_page != null && Number.isFinite(pg) ? pg : null } : null;
}
// 步驟列：核對謄本（q1 的土地清單、核對題）算「核對」，其他題目算「回答」
const isCheckQ = (q) => Boolean(q) && (q.kind === "same" || q.id.startsWith("C-") || q.id === "q1");
const stepOfQ = (q) => (isCheckQ(q) ? 2 : 3);
function questions() {
  const s = st.view?.questions;
  const list = Array.isArray(s) && s.length ? s.filter((q) => q && q.id) : Object.keys(LOCAL).map((id) => ({ id }));
  return list.map(normQ);
}
const labelOf = (q, v) => q.options.find((o) => o.value === v)?.label ?? V.LABEL[v] ?? v;

const SAY = {
  retry: "我沒聽清楚，請再講一次。",
  buttons: "我沒聽清楚，請按下面的按鈕。",
  again: "好，請再回答一次。",
  received: "收到了。接下來不用做事，好了會請你回答幾個問題。",
  doneOk: "謝謝你，回答完了。同意書做好了，請按下載。",
  doneDraft: "謝謝你，回答完了。同意書是草稿，還有幾件事要處理。",
  next: (n) => `很好。請拍第 ${n} 張。`,
  shoot: (n) => `請拍第 ${n} 張土地謄本。`,
  rb: (label) => `你講，${label}，對嗎？`,
  intro: (n) => `你好，我們要幫你準備土地使用同意書。要拍土地謄本 ${n} 張，核對謄本上的資料，回答幾個問題，再選要簽幾年，大約 10 分鐘。`,
};

// ───── 狀態
const st = {
  screen: "loading", view: null, page: 1, preview: null, checking: false, result: null,
  thumbs: {}, zoom: null,
  q: 0, mode: "wait", pending: null, fails: 0, note: "", heard: "",
  sheet: null, dir: "fwd", busy: false,
  docWait: 0, // 同意書還沒出來：0 還沒等、1 等一下再問一次、2 問過了
};

async function getView() {
  const r = await fetch(API, { cache: "no-store" });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(String(r.status));
  const v = await r.json();
  v.pages_expected = Math.max(1, Number(v.pages_expected) || 1);
  v.pages_done = Array.isArray(v.pages_done) ? v.pages_done : [];
  v.lands = Array.isArray(v.lands) ? v.lands : [];
  v.photos = Array.isArray(v.photos) ? v.photos : [];
  v.answers = v.answers && typeof v.answers === "object" ? v.answers : {};
  v.documents = Array.isArray(v.documents) ? v.documents : [];
  v.todo = Array.isArray(v.todo) ? v.todo : [];
  return v;
}

function nextPage() {
  for (let p = 1; p <= st.view.pages_expected; p++) if (!st.view.pages_done.includes(p)) return p;
  return st.view.pages_expected;
}

// 某一頁的照片：剛拍的優先，其次後端給的網址
function photoOf(page) {
  if (st.thumbs[page]) return st.thumbs[page];
  const hits = (st.view?.photos || []).filter((p) => Number(p.page) === Number(page));
  return hits.length ? safeUrl(hits[hits.length - 1].url) : "";
}

async function load() {
  if (!token) return go("badlink");
  try { st.view = await getView(); } catch { return go("offline"); }
  if (!st.view) return go("badlink");
  route();
}

// 依後端狀態決定畫面。重新打開連結會停在原處。
function route() {
  const v = st.view;
  if (v.stage === "collecting") {
    st.page = nextPage();
    go(v.pages_done.length ? "photo" : "intro");
  } else if (v.stage === "extracting") { go("received"); poll(); }
  else if (v.stage === "needs_human") go("human");
  else {
    const i = questions().findIndex((q) => !(q.id in v.answers));
    if (i < 0) go("done");
    else { st.q = i; go("ready"); } // 先按「開始回答」，瀏覽器才允許播聲音
  }
}

let pollTimer;
function poll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    try {
      const v = await getView();
      if (v) { st.view = v; if (v.stage !== "extracting") return route(); }
    } catch { /* 網路不穩就繼續等 */ }
    poll();
  }, 3000);
}

function go(screen, dir = "fwd") {
  st.screen = screen;
  st.dir = dir;
  render();
}

// ───── 共用小元件
const bar = (pct) => `<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${Math.max(4, pct)}%"></i></div>`;
const bubble = (t, s, tag = "") => `<button class="bubble" data-act="hear">${tag ? `<span class="tag">${esc(tag)}</span>` : ""}<span class="t">${esc(t)}</span><span class="s">${ic("volume")}${esc(s)}</span></button>`;
const btn = (act, icon, label, cls = "", extra = "") => `<button class="btn ${cls}" data-act="${act}" ${extra}>${icon ? ic(icon) : ""}${esc(label)}</button>`;

const STEPS = ["拍照", "等一下", "核對", "回答", "下載"];
const steps = (cur) => `<ol class="steps" aria-label="步驟">${STEPS.map((s, i) => {
  const cls = i < cur ? "done" : i === cur ? "now" : "";
  return `<li class="${cls}"${i === cur ? ' aria-current="step"' : ""}><span class="n">${i < cur ? ic("check") : i + 1}</span>${s}</li>`;
}).join("")}</ol>`;

function thumbsHtml() {
  const pages = [...st.view.pages_done].sort((a, b) => a - b);
  const items = pages.map((p) => {
    const u = photoOf(p);
    return `<figure>${u ? `<img src="${esc(u)}" alt="第 ${p} 張照片">` : ""}<span>${ic("check")}第 ${p} 張</span></figure>`;
  }).join("");
  return items ? `<div class="thumbs">${items}</div>` : "";
}

// ───── 畫面
function viewHtml() {
  const v = st.view;
  switch (st.screen) {
    case "loading":
      return `<div class="spacer"></div><div class="mid">${mascot("talk", "big-mascot")}<p class="say">打開中…</p></div><div class="spacer"></div>`;
    case "badlink":
      return `<div class="spacer"></div><div class="mid">${mascot("calm", "big-mascot")}<p class="h1">這個連結打不開</p>
        <p class="say">不用擔心。請找給你連結的人，再要一次。</p></div><div class="spacer"></div>`;
    case "offline":
      return `<div class="spacer"></div><div class="mid">${mascot("calm", "big-mascot")}<p class="h1">網路好像斷了</p>
        <p class="say">不用擔心，剛剛做的都還在。<br>請等一下，再按下面的按鈕。</p></div><div class="spacer"></div>${btn("reload", "rotate", "再試一次", "pri")}`;
    case "intro": {
      const n = v.pages_expected;
      return `${steps(0)}
        <div class="who">${mascot("happy")}${bubble("你好！", "點這裡聽我說")}</div>
        <p class="h1 sm">我們要幫你準備<br>土地使用同意書</p>
        <div class="card"><h2>你要做的事</h2><ul class="list">
          <li>${ic("camera")}<span>拍土地謄本 ${n} 張</span></li>
          <li>${ic("search")}<span>核對謄本上的資料</span></li>
          <li>${ic("chat")}<span>回答幾個問題</span></li>
          <li>${ic("calendar")}<span>選要簽幾年</span></li>
          <li>${ic("clock")}<span>大約 10 分鐘</span></li></ul></div>
        <div class="spacer"></div><div class="dock">${btn("begin", "right", "開始", "pri")}</div>`;
    }
    case "photo": return photoHtml();
    case "received":
      return `${steps(1)}<div class="mid">${mascot("happy", "big-mascot")}
        <p class="h1">收到了</p>${thumbsHtml()}
        <p class="say">正在看你的謄本</p><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <p class="say">接下來不用做事。<br>好了會請你回答幾個問題。</p>
        <p class="say" style="font-size:20px">手機可以先放著。</p></div><div class="spacer"></div>`;
    case "ready": {
      const qs = questions();
      const left = qs.length - st.q;
      return `${steps(stepOfQ(qs[st.q]))}<div class="spacer"></div><div class="mid">${mascot("talk", "big-mascot")}
        <p class="h1">${left === qs.length ? `有 ${left} 個問題要問你` : `還有 ${left} 個問題`}</p>
        <p class="say">可以用講的，也可以用按的。</p></div><div class="spacer"></div>${btn("start", "right", "開始回答", "pri")}`;
    }
    case "question": return questionHtml();
    case "done": return doneHtml();
    case "human":
      return `<div class="spacer"></div><div class="mid">${mascot("calm", "big-mascot")}
        <p class="h1">系統處理不了這份謄本</p><p class="say">不用擔心。請重新拍一次，或找家人幫忙。</p></div>
        <div class="spacer"></div>`;
  }
  return "";
}

// ───── 做好了：下載同意書
const docsOf = (v) => (v?.documents || []).filter((d) => d && typeof d === "object")
  .map((d) => ({ name: String(d.name ?? ""), url: safeUrl(d.url), draft: Boolean(d.draft) })).filter((d) => d.url);
const todoOf = (v) => (v?.todo || []).map((t) => String(t ?? "").trim()).filter(Boolean);

function answersCard() {
  const v = st.view;
  const rows = questions().filter((q) => q.id in v.answers)
    .map((q) => `<div><dt>${esc(q.text)}</dt><dd>${esc(v.answers[q.id])}</dd></div>`).join("");
  return rows ? `<div class="card"><h2>你的回答</h2><dl class="sum">${rows}</dl></div>` : "";
}
const todoCard = (todo) => (todo.length ? `<div class="card todo"><h2>還要處理的事</h2><ul class="list">
  ${todo.map((t) => `<li>${ic("info")}<span>${esc(t)}</span></li>`).join("")}</ul></div>` : "");

function doneHtml() {
  const v = st.view, docs = docsOf(v), todo = todoOf(v);
  if (!docs.length) {
    if (st.docWait < 2) {
      return `${steps(4)}<div class="mid">${mascot("happy", "big-mascot")}<p class="h1">謝謝你，回答完了</p>
        <p class="say">正在做同意書…</p><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>${answersCard()}`;
    }
    return `${steps(4)}<div class="mid">${mascot("calm", "big-mascot")}<p class="h1">同意書還沒做好</p>
      <p class="say">不用擔心，你的回答都記好了。<br>請等一下，再按下面的按鈕。</p></div>
      ${todoCard(todo)}${answersCard()}<div class="spacer"></div><div class="dock">${btn("reload", "rotate", "再看一次", "pri")}</div>`;
  }
  const draft = docs.some((d) => d.draft);
  const head = draft
    ? `<div class="mid">${mascot("happy", "big-mascot")}<p class="h1">同意書是草稿</p><span class="draft">草稿</span>
        <p class="say">還有幾件事要處理，處理好才是正式的。</p></div>`
    : `<div class="mid"><svg class="check" width="80" height="80" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="44" fill="#4A9A2E"/>
        <path d="M28 50l14 14 28-30" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p class="h1">同意書做好了</p></div>`;
  const dl = docs.map((d, i) => `<a class="btn pri" href="${esc(d.url)}" download="${esc(d.name)}">${ic("download")}${docs.length > 1 ? `下載第 ${i + 1} 份` : "下載同意書"}</a>`).join("");
  return `${steps(4)}${head}<div class="dl">${dl}</div>
    ${draft ? todoCard(todo) : ""}
    <div class="card"><h2>接下來</h2><ul class="list">
      <li><span class="num">1</span>${ic("print")}<span>印出來</span></li>
      <li><span class="num">2</span>${ic("pen")}<span>甲方、乙方簽名蓋章</span></li>
      <li><span class="num">3</span>${ic("calendar")}<span>填上日期</span></li></ul>
      <p class="small">乙方（耕作人）的名字和身分證號，簽的時候用手寫。</p></div>
    ${reportCard()}${answersCard()}`;
}

// 土地分析報告：重點摘要＋下載（內容由後端固定範本產生，見 app/agents/report.py）
function reportCard() {
  const r = st.view?.report;
  const url = r && safeUrl(r.url);
  if (!url) return "";
  const n = Number(r.lands) || 0;
  const rows = [
    `${ic("doc")}<span>${n} 筆地${r.total_ha ? `，合計 ${esc(r.total_ha)} 公頃` : ""}</span>`,
    `${ic("check")}<span>已核對 ${Number(r.checked) || 0} 筆，共 ${n} 筆</span>`,
    Array.isArray(r.issues) && r.issues.length
      ? `${ic("info")}<span>要留意：${r.issues.map(esc).join("、")}</span>`
      : `${ic("info")}<span>沒有發現要特別留意的事</span>`,
  ];
  if (Number(r.todo)) rows.push(`${ic("help")}<span>還有 ${Number(r.todo)} 件事要處理</span>`);
  return `<div class="card"><h2>分析報告</h2><ul class="list">${rows.map((x) => `<li>${x}</li>`).join("")}</ul>
    <p class="small">報告只供參考，不是法律意見。</p>
    <a class="btn" href="${esc(url)}" download="${esc(r.name || "土地分析報告.docx")}">${ic("download")}下載分析報告</a></div>`;
}

// 同意書還沒出來：等 2 秒再問一次後端，只問一次
function waitDocs() {
  if (st.screen !== "done" || st.docWait !== 0 || docsOf(st.view).length) return;
  st.docWait = 1;
  setTimeout(async () => {
    try { const v = await getView(); if (v) st.view = v; } catch { /* 網路不穩：照樣顯示「還沒做好」 */ }
    st.docWait = 2;
    if (st.screen === "done") route();
  }, 2000);
}

function photoHtml() {
  const v = st.view, n = v.pages_expected;
  const backBtn = !v.pages_done.length && !st.checking && !st.result ? btn("toIntro", "left", "", "back", 'aria-label="回上一步"') : "";
  const head = `${steps(0)}<div class="top">${backBtn}${bar((v.pages_done.length / n) * 100)}</div>
    <div class="who">${mascot(st.result?.ok ? "happy" : "talk")}${bubble("請拍土地謄本", `第 ${st.page} 張，共 ${n} 張・點這裡聽`)}</div>`;

  if (st.checking) {
    return `${head}<div class="view"><img src="${esc(st.preview)}" alt="剛拍的照片"><div class="scan"></div></div>
      <p class="say center">看一下照片清不清楚…</p>`;
  }
  if (st.result) {
    const r = st.result;
    const rows = r.checks.map((c) => `<li class="${c.ok ? "ok" : "warn"}">${ic(c.ok ? "check" : c.id === "bright" ? "sun" : c.id === "sharp" ? "hand" : "help")}<span>${esc(c.text)}</span></li>`).join("");
    const advice = r.hints.length
      ? `<div class="advice">${r.hints.map((h) => `<div>${ic("info")}<span>${esc(h)}</span></div>`).join("")}</div>` : "";
    return `${head}<div class="result">${st.preview ? `<img src="${esc(st.preview)}" alt="剛拍的照片">` : "<span></span>"}
      <div><p class="say" style="margin-bottom:6px">這張照片：</p><ul class="checks">${rows}</ul></div></div>${advice}`;
  }
  return `${head}
    <div class="tips"><div>${ic("sun")}亮一點</div><div>${ic("corners")}四個角都拍到</div><div>${ic("hand")}拿穩</div></div>
    <div class="view">${ic("doc")}<span>謄本第 ${st.page} 頁</span></div>
    ${v.pages_done.length ? `<p class="say">已經拍好：</p>${thumbsHtml()}` : ""}
    <div class="spacer"></div>${st.sheet ? "" : `<div class="dock">${btn("shoot", "camera", "拍照", "pri")}</div>`}`;
}

function landHtml(l) {
  const area = String(l.area_raw ?? "").trim();
  const u = l.page != null ? photoOf(l.page) : "";
  return `<div class="land"><div class="txt"><small>${esc(l.location)}</small><b>${esc(l.lot_no)}</b>
    ${area ? `<span class="area">謄本上寫：面積 ${esc(area)}${l.area_unit ? ` ${esc(l.area_unit)}` : ""}</span>` : ""}</div>
    ${u ? `<button class="thumbbtn" data-act="zoom" data-src="${esc(u)}" aria-label="看謄本第 ${esc(l.page)} 頁的照片"><img src="${esc(u)}" alt="">看照片</button>` : ""}</div>`;
}

function checkCardHtml(q) {
  const c = q.card;
  if (!c) return "";
  const rows = c.rows.map((r) => {
    const unclear = r.value.includes("看不清");
    return `<div><dt>${esc(r.label)}</dt><dd${unclear ? ' class="unclear"' : ""}>${unclear ? ic("help") : ""}${esc(r.value)}</dd></div>`;
  }).join("");
  const u = c.page != null ? photoOf(c.page) : "";
  return `<div class="card chk"><dl>${rows}</dl>
    ${u ? `<button class="thumbbtn" data-act="zoom" data-src="${esc(u)}" aria-label="看謄本第 ${esc(c.page)} 頁的照片"><img src="${esc(u)}" alt="">看照片</button>` : ""}</div>`;
}

function questionHtml() {
  const qs = questions(), q = qs[st.q], v = st.view;
  if (!q) return "";
  const done = st.q + (st.sheet ? 1 : 0);
  const listening = st.mode === "listen" || st.mode === "rbListen";
  const face = st.sheet ? "happy" : listening ? "listen" : "talk";
  const top = `${steps(stepOfQ(q))}<div class="top">${btn("back", "left", "", "back", 'aria-label="回上一步"')}${bar((done / qs.length) * 100)}</div>
    <div class="who">${mascot(face)}${bubble(q.text, `第 ${st.q + 1} 題，共 ${qs.length} 題・點這裡再聽一次`, q.legal ? "確認一下" : "")}</div>
    ${q.why ? `<p class="why">${ic("info")}<span>${esc(q.why)}</span></p>` : ""}`;
  const lands = q.id === "q1" && v.lands.length ? `<div class="lands">${v.lands.map(landHtml).join("")}</div>` : checkCardHtml(q);
  const note = st.note ? `<div class="note">${esc(st.note)}</div>` : "";
  const heard = st.heard ? `<div class="heard">聽到：${esc(st.heard)}</div>` : "";

  if (listening) {
    const hint = st.mode === "rbListen" ? "說「對」或「不對」" : q.hint;
    return `${top}<div class="mid"><div class="mic">${ic("mic")}</div><p class="h1">我在聽，請說</p><p class="say">${esc(hint)}</p></div>
      <div class="spacer"></div>${btn("stopListen", "stop", "不講了，改用按的", "soft")}`;
  }
  if (st.mode === "readback") {
    const said = labelOf(q, st.pending.v);
    return `${top}<div class="mid"><p class="say">你講的是</p><div class="rb pop${said.length > 4 ? " long" : ""}">${esc(said)}</div><p class="h1">對嗎？</p></div>
      ${note}<div class="spacer"></div>${btn("rbYes", "check", "對", "pri")}${btn("rbNo", "left", "不對，再講一次")}`;
  }
  const opts = q.main.map((o) => btn("ans", optIcon(q, o), o.label, "", `data-v="${esc(o.value)}"`)).join("");
  return `${top}${lands}${heard}${note}
    ${V.canListen ? btn("listen", "mic", "按一下，用講的", "pri") : ""}
    <div class="${q.stack ? "stack" : q.grid ? "grid" : "row"}">${opts}</div>
    ${btn("ans", "help", q.unsure.label, "soft", 'data-v="unsure"')}`;
}

function devHtml() {
  const dis = st.checking ? " disabled" : "";
  return `<b>測試用（只在本機出現）：不用相機，直接送假謄本當第 ${st.page} 張</b>
    <select id="devCase" aria-label="假謄本">${["C01", "C02", "C03"].map((c) => `<option${c === devCase ? " selected" : ""}>${c}</option>`).join("")}</select>
    <button data-act="devSend" data-k="p1"${dis}>第 1 頁</button><button data-act="devSend" data-k="p2"${dis}>第 2 頁</button>
    <button data-act="devSend" data-k="bad"${dis}>壞照片</button>`;
}
let devCase = "C01";

let lastKey = "";
function render() {
  const key = `${st.screen}:${st.screen === "question" ? st.q : st.screen === "photo" ? st.page : ""}`;
  const main = $("#main");
  main.innerHTML = viewHtml();
  if (key !== lastKey) {
    main.classList.remove("fwd", "bk");
    void main.offsetWidth;
    main.classList.add(st.dir === "back" ? "bk" : "fwd");
    lastKey = key;
  }
  main.inert = Boolean(st.sheet || st.zoom || desk.open);
  const ask = $("#askrow");
  ask.hidden = ["loading", "badlink"].includes(st.screen) || Boolean(st.zoom);
  ask.firstElementChild.innerHTML = `${ic("mic")}問問題`;
  ask.inert = Boolean(desk.open);
  const dev = $("#dev");
  const showDev = IS_LOCAL && st.screen === "photo";
  dev.hidden = !showDev;
  dev.inert = Boolean(st.zoom);
  if (showDev) dev.innerHTML = devHtml();
  waitDocs();
}

// ───── 底部回饋面板
function showSheet(o) {
  st.sheet = o;
  const el = $("#sheet");
  el.className = o.tone;
  el.querySelector(".in").innerHTML = `<div class="title pop">${ic(o.icon || "ok")}<span>${esc(o.title)}</span></div>
    ${o.body ? `<p class="body">${esc(o.body)}</p>` : ""}
    ${btn(o.act, o.btnIcon || "right", o.label, "pri")}
    ${o.redo ? btn("redo", "left", "不對，重選", "soft") : ""}`;
  document.body.classList.add("sheet-open");
  void el.offsetWidth; // 先讓瀏覽器算一次位置，滑上來的動畫才會播；不用 requestAnimationFrame，避免收起後又被加回來
  el.classList.add("up");
  render();
  setTimeout(() => { if (st.sheet === o) el.querySelector(".btn")?.focus({ preventScroll: true }); }, 320);
}
function hideSheet() {
  st.sheet = null;
  $("#sheet").classList.remove("up");
  document.body.classList.remove("sheet-open");
}

// ───── 看大張照片
function openZoom(src) {
  st.zoom = src;
  const z = $("#zoom");
  z.innerHTML = `<img src="${esc(src)}" alt="謄本照片">${btn("zoomClose", "x", "關閉", "pri")}`;
  z.hidden = false;
  render();
  z.querySelector(".btn").focus({ preventScroll: true });
}
function closeZoom() {
  st.zoom = null;
  $("#zoom").hidden = true;
  $("#zoom").innerHTML = "";
  render();
}

// ───── 拍照（相機和本機測試面板走同一條路）
function imageSize(url) {
  return new Promise((done) => {
    const img = new Image();
    const t = setTimeout(() => done(null), 4000);
    img.onload = () => { clearTimeout(t); done({ w: img.naturalWidth, h: img.naturalHeight }); };
    img.onerror = () => { clearTimeout(t); done(null); };
    img.src = url;
  });
}
// 只是建議，不擋人；能不能用只看後端的 ok
function adviceFor(size) {
  const out = [];
  if (!size) return out;
  if (size.w > size.h * 1.1) out.push("謄本是直的，手機直著拍比較好");
  if (Math.max(size.w, size.h) < 1000) out.push("靠近一點拍");
  return out;
}
// 舊後端沒有 checks：從 reason 推回來
function checksOf(r) {
  if (Array.isArray(r.checks) && r.checks.length) {
    return r.checks.map((c) => ({ id: String(c.id ?? ""), ok: Boolean(c.ok), text: String(c.text ?? "") }));
  }
  const reason = String(r.reason || "");
  const dark = reason.includes("暗"), blur = reason.includes("糊");
  if (!r.ok && !dark && !blur) return [{ id: "other", ok: false, text: reason || "這張不能用" }];
  return [{ id: "bright", ok: !dark, text: dark ? "有點暗" : "夠亮" }, { id: "sharp", ok: !blur, text: blur ? "有點糊" : "清楚" }];
}

async function uploadPhoto(file) {
  if (st.checking) return;
  hideSheet();
  if (st.preview && !Object.values(st.thumbs).includes(st.preview)) URL.revokeObjectURL(st.preview);
  st.preview = URL.createObjectURL(file);
  st.result = null;
  st.checking = true;
  render();
  const page = st.page;
  const fd = new FormData();
  fd.append("page", String(page));
  fd.append("file", file, file.name || "photo.jpg");
  let r = null;
  const sizeP = imageSize(st.preview);
  try {
    const [res] = await Promise.all([fetch(`${API}/photos`, { method: "POST", body: fd }), sleep(1000)]);
    if (res.ok) r = await res.json();
  } catch { /* 下面處理 */ }
  const size = await sizeP;
  st.checking = false;
  if (!r) {
    render();
    showSheet({ tone: "warn", icon: "camera", title: "照片沒有送出去", body: "請再拍一次。", act: "shoot", label: "再拍一次", btnIcon: "camera" });
    return;
  }
  st.result = { ok: Boolean(r.ok), checks: checksOf(r), hints: adviceFor(size) };
  if (!r.ok) {
    const reason = String(r.reason || "這張照片不能用，請再拍一次");
    const [title, ...rest] = reason.split("，");
    showSheet({ tone: "warn", icon: reason.includes("暗") ? "sun" : "hand", title, body: rest.length ? rest.join("，") + "。" : "",
      act: "shoot", label: "再拍一次", btnIcon: "camera" });
    V.speak(reason + "。");
    return;
  }
  st.thumbs[page] = st.preview;
  if (!st.view.pages_done.includes(page)) st.view.pages_done.push(page);
  if (r.all_pages_done) {
    st.view.stage = "extracting";
    showSheet({ tone: "ok", title: "這張可以用", body: "謄本都拍好了。", act: "toReceived", label: "繼續" });
    return;
  }
  const n = nextPage();
  showSheet({ tone: "ok", title: "這張可以用", act: "photoNext", label: `拍第 ${n} 張`, btnIcon: "camera" });
  V.speak(SAY.next(n));
}

$("#cam").addEventListener("change", (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (file) uploadPhoto(file);
});

const DEV_FILES = { p1: (c) => `${c}/photo_page1.jpg`, p2: (c) => `${c}/page2.png`, bad: () => "C03/photo_page1_bad.jpg" };
async function devSend(kind) {
  const c = ["C01", "C02", "C03"].includes(devCase) ? devCase : "C01";
  const path = DEV_FILES[kind]?.(c);
  if (!path) return;
  try {
    const res = await fetch(`../data/samples/fake-transcripts/${path}`);
    if (!res.ok) throw new Error(String(res.status));
    const blob = await res.blob();
    uploadPhoto(new File([blob], path.split("/").pop(), { type: blob.type || "image/jpeg" }));
  } catch (err) {
    console.warn("測試照片讀不到", path, err);
  }
}

// ───── 回答
const curQ = () => questions()[st.q];
function sayQuestion() { const q = curQ(); if (q) V.speak(q.say); }

async function startListen() {
  const readback = st.mode === "readback";
  st.mode = readback ? "rbListen" : "listen";
  st.note = "";
  render();
  const r = await V.listen();
  if (st.mode !== "listen" && st.mode !== "rbListen") return; // 已經改用按的
  if (r.error) {
    st.mode = readback ? "readback" : "wait";
    st.note = r.error === "denied" ? "麥克風沒有打開。請用下面的按鈕回答。" : "這支手機不能用講的。請用下面的按鈕回答。";
    return render();
  }
  const q = curQ();
  for (const a of r.alts) {
    const v = readback ? V.match("yesno", a) : V.matchOption(q, a);
    if (v) return onHeard(v, a, readback);
  }
  if (readback) { st.mode = "readback"; return render(); }
  st.fails += 1;
  st.mode = "wait";
  st.heard = r.alts[0] || "";
  st.note = st.fails >= 2 ? SAY.buttons : SAY.retry;
  render();
  V.speak(st.note);
}

function onHeard(v, transcript, readback) {
  if (!readback) {
    st.pending = { v, transcript };
    st.mode = "readback";
    st.heard = "";
    render();
    // 唸回確認後自動再聽一次「對／不對」；也可以直接按
    V.speak(SAY.rb(labelOf(curQ(), v))).then(() => { if (st.mode === "readback" && st.pending?.v === v) startListen(); });
    return;
  }
  if (v === "yes") submit(st.pending.v, "voice", st.pending.transcript);
  else { st.pending = null; st.mode = "wait"; render(); V.speak(SAY.again); }
}

async function submit(value, channel, transcript = "") {
  if (st.busy) return;
  const q = curQ();
  if (!q) return;
  st.busy = true;
  st.mode = "wait";
  V.cancelListen();
  V.stop();
  try {
    const r = await fetch(`${API}/answers`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q.id, value, channel, transcript }),
    });
    if (!r.ok) throw new Error(String(r.status));
    const body = await r.json();
    if (body.answers && typeof body.answers === "object") st.view.answers = body.answers;
    if (Array.isArray(body.questions) && body.questions.length) st.view.questions = body.questions; // 題目可能變多或變少
    if (Array.isArray(body.documents)) st.view.documents = body.documents;
    if (Array.isArray(body.todo)) st.view.todo = body.todo;
    if ("report" in body) st.view.report = body.report;
  } catch {
    st.busy = false;
    st.note = "沒有送出去，請再按一次。";
    return render();
  }
  st.busy = false;
  st.pending = null; st.fails = 0; st.note = ""; st.heard = "";
  const qs = questions();
  const i = qs.findIndex((x) => x.id === q.id);
  if (i >= 0) st.q = i;
  showSheet({ tone: "ok", title: `記好了：${labelOf(q, value)}`, act: "next", label: st.q < qs.length - 1 ? "繼續" : "完成", redo: true });
}

// ───── 服務台：按「問問題」用講的發問，阿伯從固定答案庫回答（app/agents/faq.py）
const desk = { open: false, log: [], mode: "wait", note: "", sugg: null, busy: false };
const DESK_HELLO = "有什麼不懂的，都可以問我。按綠色的按鈕，用講的問。";
const DESK_SUGG = {
  photo: ["這是要做什麼？", "怎麼拍比較清楚？", "我的資料安全嗎？"],
  wait: ["還要多久？", "這是要做什麼？", "我的資料安全嗎？"],
  answer: ["現在要做什麼？", "我不知道怎麼答", "按錯了怎麼辦？"],
  done: ["怎麼簽名？", "什麼是草稿？", "這是要做什麼？"],
};
const deskPhase = () => (["intro", "photo"].includes(st.screen) ? "photo"
  : ["received", "human"].includes(st.screen) ? "wait" : st.screen === "done" ? "done" : "answer");

function deskHtml() {
  const listening = desk.mode === "listen";
  const bots = desk.log.filter((m) => m.who === "bot");
  const last = bots.length ? bots[bots.length - 1].text : DESK_HELLO;
  const face = listening ? "listen" : desk.busy ? "calm" : "talk";
  const earlier = desk.log.slice(0, -1).slice(-4)
    .map((m) => `<p class="${m.who === "me" ? "me" : "bot"}">${m.who === "me" ? "你問：" : "阿伯："}${esc(m.text)}</p>`).join("");
  const sugg = (desk.sugg || DESK_SUGG[deskPhase()]).map((s) => btn("deskChip", "help", s, "", `data-q="${esc(s)}"`)).join("");
  const action = listening
    ? `<div class="mid"><div class="mic">${ic("mic")}</div><p class="h1">我在聽，請說你的問題</p></div>${btn("deskStop", "stop", "不講了", "soft")}`
    : btn("deskListen", "mic", desk.busy ? "阿伯在想…" : "按一下，說你的問題", "pri", desk.busy ? "disabled" : "");
  return `<div class="in">
    <div class="who">${mascot(face)}<button class="bubble" data-act="deskRepeat"><span class="t" style="font-size:22px">${esc(last)}</span>
      <span class="s">${ic("volume")}點這裡再聽一次</span></button></div>
    ${earlier ? `<div class="log" aria-label="剛剛問的">${earlier}</div>` : ""}
    ${desk.note ? `<div class="note">${esc(desk.note)}</div>` : ""}
    ${action}
    <p class="say" style="font-size:19px">也可以直接按下面的問題：</p>
    <div class="chips">${sugg}</div>
    ${btn("deskClose", "left", "回去繼續", "soft")}
  </div>`;
}
function renderDesk() {
  const d = $("#desk");
  d.hidden = !desk.open;
  d.innerHTML = desk.open ? deskHtml() : "";
}
function deskOpen() {
  V.cancelListen(); V.stop();
  if (st.mode === "listen" || st.mode === "rbListen") { st.mode = st.pending ? "readback" : "wait"; }
  desk.open = true; desk.note = ""; desk.mode = "wait"; desk.sugg = null;
  renderDesk(); render();
  $("#desk .btn.pri")?.focus({ preventScroll: true });
  V.speak(desk.log.length ? "請說你的問題。" : DESK_HELLO);
}
function deskClose() {
  V.cancelListen(); V.stop();
  desk.open = false; desk.mode = "wait";
  renderDesk(); render();
}
async function deskAsk(text, channel) {
  if (desk.busy) return;
  desk.busy = true; desk.note = "";
  desk.log.push({ who: "me", text });
  renderDesk();
  let r = null;
  try {
    const res = await fetch(`${API}/ask`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, channel }) });
    if (res.ok) r = await res.json();
  } catch { /* 下面處理 */ }
  const answer = typeof r?.answer === "string" && r.answer ? r.answer : "現在沒辦法回答，請等一下再問一次。";
  desk.log.push({ who: "bot", text: answer });
  if (Array.isArray(r?.suggestions)) desk.sugg = r.suggestions.filter((s) => typeof s === "string").slice(0, 4);
  desk.busy = false;
  renderDesk();
  V.speak(typeof r?.say === "string" && r.say ? r.say : answer);
}
async function deskListen() {
  desk.mode = "listen"; desk.note = "";
  renderDesk();
  const r = await V.listen();
  if (desk.mode !== "listen") return; // 已經按「不講了」或關掉
  desk.mode = "wait";
  if (r.error) {
    desk.note = r.error === "denied" ? "麥克風沒有打開。請按下面的問題。" : "這支手機不能用講的。請按下面的問題。";
    return renderDesk();
  }
  const text = (r.alts || [])[0] || "";
  if (!text.trim()) {
    desk.note = "我沒聽清楚，可以再說一次，或按下面的問題。";
    renderDesk();
    return V.speak(desk.note);
  }
  deskAsk(text.trim(), "voice");
}

// ───── 按鈕
const ACT = {
  deskOpen: () => deskOpen(),
  deskClose: () => deskClose(),
  deskListen: () => deskListen(),
  deskStop: () => { desk.mode = "wait"; V.cancelListen(); renderDesk(); },
  deskChip: (el) => { V.cancelListen(); desk.mode = "wait"; deskAsk(el.dataset.q, "button"); },
  deskRepeat: () => { const b = desk.log.filter((m) => m.who === "bot"); V.speak(b.length ? b[b.length - 1].text : DESK_HELLO); },
  reload: () => { st.docWait = 0; go("loading"); load(); },
  begin: () => { st.page = nextPage(); go("photo"); V.speak(SAY.shoot(st.page)); },
  toIntro: () => go("intro", "back"),
  shoot: () => $("#cam").click(),
  photoNext: () => { hideSheet(); st.preview = null; st.result = null; st.page = nextPage(); go("photo"); V.speak(SAY.shoot(st.page)); },
  toReceived: () => { hideSheet(); st.preview = null; st.result = null; go("received"); V.speak(SAY.received); poll(); },
  devSend: (el) => devSend(el.dataset.k),
  zoom: (el) => openZoom(el.dataset.src),
  zoomClose: () => closeZoom(),
  hear: () => {
    if (st.screen === "question") sayQuestion();
    else if (st.screen === "photo") V.speak(SAY.shoot(st.page));
    else if (st.screen === "intro") V.speak(SAY.intro(st.view.pages_expected));
  },
  start: () => { st.mode = "wait"; go("question"); sayQuestion(); },
  listen: () => startListen(),
  stopListen: () => { st.mode = st.pending ? "readback" : "wait"; V.cancelListen(); render(); },
  ans: (el) => { V.cancelListen(); submit(el.dataset.v, "button"); },
  rbYes: () => { V.cancelListen(); submit(st.pending.v, "voice", st.pending.transcript); },
  rbNo: () => { st.mode = "wait"; V.cancelListen(); st.pending = null; render(); V.speak(SAY.again); },
  next: () => {
    hideSheet();
    const qs = questions();
    if (st.q < qs.length - 1) { st.q += 1; st.mode = "wait"; go("question"); sayQuestion(); }
    else {
      st.docWait = 0;
      go("done");
      const docs = docsOf(st.view);
      if (docs.length) V.speak(docs.some((d) => d.draft) ? SAY.doneDraft : SAY.doneOk);
    }
  },
  redo: () => { hideSheet(); render(); sayQuestion(); },
  back: () => {
    V.cancelListen(); V.stop();
    st.mode = "wait"; st.pending = null; st.note = ""; st.heard = "";
    if (st.q === 0) return go("ready", "back");
    st.q -= 1; go("question", "back"); sayQuestion();
  },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled && ACT[el.dataset.act]) ACT[el.dataset.act](el);
});
document.addEventListener("change", (e) => { if (e.target.id === "devCase") devCase = e.target.value; });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (desk.open) deskClose(); else if (st.zoom) closeZoom();
});
window.addEventListener("hashchange", () => location.reload());

V.loadAudio();
render();
load();
</script>
